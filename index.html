<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix</title>
</head>
<body class="container principal">

    <header class="container__cabecalho">
        <div class="container__navegation__left">
            <img class="container__netflix" src="assets/image/NetflixLogo.png" alt="">
            <a class="container__navegation" href="#"> <strong>Home</strong></a>
            <a class="container__navegation" href="#">TV Show</a>
            <a class="container__navegation" href="#">Movies</a>
            <a class="container__navegation" href="#">New & Popular</a>
            <a class="container__navegation" href="#">My List</a>
            <a class="container__navegation" href="#">Browse by Languages</a>
        </div>

        <div class="container__navegation__right">
            <img class="container__search" src="assets/image/Search.png" alt="">

            <a class="container__navegation" href="#">Kids</a>

            <img class="container__bell" src="assets/image/Bell.png" alt="">
            <img class="container__avatar" src="assets/image/Avatar.png" alt="">
            <img class="container__arrow" src="assets/image/Arrow down.png" alt="">
        </div>
    </header>

    <main>
        <section class="section__main">
            <img class="main__show__logo" src="assets/image/Show Logo.png" alt="">
        <div class="main__subtexto">
            <img class="main__top" src="assets/image/Top10.png" alt="">
            <h2 class="main__text" >#1 in TV Shows Today</h2>
        </div>
        <p class="main__descricao">Determined to protect a young patient who escaped a mysterious
        cult, a psychiatrist takes the girl in, putting her own family — and
            life — in danger.</p>

            <section class="main__buttons__section">
                <div class="button">
                    <a class="main__button" href="#">
                        <img src="assets/image/Polygon 1.png" alt="">
                            Play
                        </a>
                </div>
                <div class="main__more__button">
                    <a class="main__more" href="#">
                        <img class="more__img" src="assets/image/Info btn.png" alt="">
                        More info
                    </a>
                </div>    
            </section>

           <section class="section_nav">
               <h2 class="nav__txt">Popular on Netflix</h2>
            <div class="nav__main">
                <a href=""><img src="assets/image/Card 1.png" alt=""></a>
                <a href=""><img src="assets/image/Card 2.png" alt=""></a>
                <a href=""><img src="assets/image/Card 3.png" alt=""></a>
                <a href=""><img src="assets/image/Card 4.png" alt=""></a>
                <a href=""><img src="assets/image/Card 5.png" alt=""></a>
            </div>
           </section> 
        </section>
    </main>
</body>
</html>
